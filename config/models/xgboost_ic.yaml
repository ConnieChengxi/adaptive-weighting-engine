model:
  name: xgboost_ic
  target: next_period_factor_ic
  ic_method: spearman_rank
  training_window_months: 36
  retrain_frequency: monthly
  negative_prediction_weight: 0.0
  fallback: fixed_weight_baseline
  min_training_rows: 24
  shrinkage:
    enabled: true
    ic_weight: 0.8
    baseline_weight: 0.2
  features:
    include_market_features: true
    ic_lag_months: [1, 2, 3]
    ic_rolling_means: [3, 6]
  xgb_params:
    n_estimators: 150
    max_depth: 2
    learning_rate: 0.04
    subsample: 0.7
    colsample_bytree: 0.7
    min_child_weight: 3.0
    gamma: 0.1
    reg_alpha: 0.2
    reg_lambda: 2.0
    random_state: 42
    objective: reg:squarederror
