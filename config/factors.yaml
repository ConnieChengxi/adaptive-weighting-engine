factors:
  momentum:
    current_windows_months: [3, 6]
    residual_window_months: 24
    candidate_lookbacks_months: [6, 12]
    retained_lookback_months: 12
    skip_recent_months: 1
  liquidity:
    window_days: 21
    winsorization:
      lower_quantile: 0.01
      upper_quantile: 0.99
  volatility:
    window_days: 63

standardization:
  method: cross_sectional_zscore
  rebalance_frequency: monthly
