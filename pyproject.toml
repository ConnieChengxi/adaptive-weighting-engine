[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-weighting-engine"
version = "0.1.0"
description = "Research codebase for adaptive ETF factor weighting."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Chengxima" }
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "yfinance>=0.2.54",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "seaborn>=0.13"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
